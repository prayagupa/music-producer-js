  - id: gp-019
    prompt: "custom genre fusion"
    controls: { tempo_bpm: 110, key: "D", genre: "other", mood: "other", genre_custom: "synthwave", mood_custom: "nostalgic" }
    expected_constraints: { min_melody_notes: 4, min_drum_hits: 1 }
  - id: gp-020
    prompt: "four bar loop for content creation"
    controls: { tempo_bpm: 95, key: "Am", genre: "electronic", mood: "calm" }
    expected_constraints: { min_melody_notes: 4, min_drum_hits: 1, bars: 4 }
  - id: gp-021
    prompt: "add energy and faster tempo"
    controls: { tempo_bpm: 130, key: "G", genre: "pop", mood: "energetic" }
    expected_constraints: { min_melody_notes: 4, min_drum_hits: 1 }
    reference_notes: "Refinement-style prompt"
