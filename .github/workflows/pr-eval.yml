name: PR Eval

on:
  pull_request:
    branches: [main]

jobs:
  eval-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install pyyaml

      - name: Run eval-quick with mock LLM
        run: make eval-quick
        env:
          EVAL_MOCK_LLM: "true"

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/*.json
